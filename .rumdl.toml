# rumdl config. rumdl lints AND formats Markdown (one tool): `rumdl check` lints,
# `rumdl fmt` formats; hk drives both via Builtins.rumdl. Reference: https://rumdl.dev
[global]
# MD033 (inline HTML) and MD034 (bare URLs) are off; MD013 (line length) stays on
# with reflow — see [MD013].
disable = ["MD033", "MD034"]

# Respect .gitignore when scanning directories.
respect-gitignore = true

exclude = [
  ".git",
  ".github",
  "node_modules",
  "dist",
  "CHANGELOG.md",
  "LICENSE.md",
]

[MD024]
# Only flag duplicate headings that are siblings (share a parent), not across the
# whole document.
siblings-only = true

[MD013]
# Reflow holds prose to the line length, but code can't be wrapped to fit —
# exempt it so it doesn't fail an otherwise-clean file. (Tables are already
# exempt by rumdl's own default.)
line-length = 90
reflow      = true
reflow-mode = "normalize"
code-spans  = false
code-blocks = false
