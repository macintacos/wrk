[settings]
# Commit mise.lock for reproducible, checksum-pinned tool versions.
lockfile = true

# HK_MISE routes hk's git-hook subprocesses through `mise x`, so each hook step
# uses the versions pinned below — even for committers who never activated mise.
[env]
HK_MISE = 1

[tools]
# hk evaluates hk.pkl through pkl, so both are required. pkl also powers the
# Pkl(Format) / Pkl(Lint) steps. Keep hk in lockstep with hk.pkl's amends/import
# version.
hk  = "1.54"
pkl = "0.32"

# The workspace's runtime, package manager and test runner.
bun = "1.3"

# Formatters/linters that run outside the project. TypeScript itself is NOT here
# — it is a dev dependency the project runs via `bun x tsc`.
biome = "2.5"  # JS/TS format + lint (config in biome.jsonc)
rumdl = "0.2"  # Markdown format + lint (config in .rumdl.toml)
taplo = "0.10" # TOML format + lint (config in taplo.toml)

# Shell, for scripts/bootstrap.sh and the extensionless .mise/tasks/* forwarders.
# The forwarders carry no extension; hk's builtins select them by shebang rather
# than by glob — see the Shell(Format)/Shell(Lint) steps in hk.pkl.
shellcheck = "0.11" # shell lint
shfmt      = "3.13" # shell format (tabs, shfmt's own default)

# yamlfmt is deliberately absent: this repo has no YAML. It arrives with the
# first file that needs it.

# (Re)register git hooks whenever tools are installed or updated.
[hooks]
postinstall = "hk install --mise"

# Tasks are file tasks in .mise/tasks/, not [tasks] entries here. Each is a thin
# bash forwarder that execs `bun scripts/tasks/cli.ts <name> "$@"`, so commander
# owns every flag, default and --help while the task file stays one line. Each
# one sources scripts/bootstrap.sh first, the dep-free guard that makes a task
# work on a fresh clone; test/tasks.test.ts is what keeps that true.
